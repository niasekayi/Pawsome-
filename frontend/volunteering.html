<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Opportunities – Pawsome</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/filters.css">
    <link rel="stylesheet" href="/css/gallery.css">
</head>
<body>

    <!-- ── Navigation ────────────────────────────── -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <img src="/pawsome-logo.png" alt="Pawsome logo" class="navbar-logo">
                <span>Pawsome</span>
            </a>
            <nav class="navbar-links">
                <a href="/">Home</a>
                <a href="/volunteering" class="active">Volunteer</a>
                <a href="/#about">About</a>
            </nav>
            <a href="/volunteering" class="btn btn-outline-light">Find Opportunities</a>
        </div>
    </header>

    <!-- ── Page header ───────────────────────────── -->
    <section class="page-header">
        <div class="container">
            <h1>Volunteer Opportunities</h1>
            <p>Enter your ZIP code below to discover organizations near you.</p>
        </div>
    </section>

    <!-- ── Filters ───────────────────────────────── -->
    <section class="filters-section">
        <div class="container">
            <div class="filter-bar">
                <div class="zip-input-group">
                    <label for="zip-input">ZIP Code</label>
                    <input
                        type="text"
                        id="zip-input"
                        placeholder="e.g. 10001"
                        maxlength="5"
                        inputmode="numeric"
                        autocomplete="postal-code"
                    >
                </div>
                <div class="category-filters">
                    <span class="filter-label">Category:</span>
                    <button class="category-btn active" data-category="">All</button>
                    <button class="category-btn" data-category="Animals">Animals</button>
                    <button class="category-btn" data-category="Community">Community</button>
                    <button class="category-btn" data-category="Education">Education</button>
                    <button class="category-btn" data-category="Environment">Environment</button>
                    <button class="category-btn" data-category="Health">Health</button>
                    <button class="category-btn" data-category="Seniors">Seniors</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ── Gallery ───────────────────────────────── -->
    <section class="gallery-section">
        <div class="container">
            <div id="gallery-status" class="gallery-status">
                <p>Enter a ZIP code above to find volunteer opportunities near you.</p>
            </div>
            <div class="vc-gallery" id="vc-gallery"></div>
        </div>
    </section>

    <!-- ── Footer ────────────────────────────────── -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Pawsome &mdash; Making a difference, one paw at a time.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/hover.js"></script>
    <script src="/js/gallery.js"></script>
    <script src="/js/filters.js"></script>
</body>
</html>
